# Safe by default: nothing here is a working credential. Every secret comes from the
# environment so a production deploy fails fast instead of running on dev values.
# For local work use the dev profile (quote the -D flag in PowerShell, which splits
# unquoted arguments on the dots):
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
app.jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ORIGINS:}

# Never leak internals to clients. These explicit values also override DevTools,
# which otherwise flips stack traces back on in local runs.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false

#images upload settings -- can be repalced with google drive or cloud upload images
app.upload.dir=uploads/products
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.marketplace.enabled=true

spring.ai.model.embedding=ollama
spring.ai.model.chat=ollama

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2:1b

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# Outbound mail credentials are secrets too: supply them at deploy time.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.notifications.admin-email=${ADMIN_NOTIFICATION_EMAIL:}

# Real Whish merchant credentials slot in here once you're approved — currently unused
app.payments.whish.api-key=${WHISH_API_KEY:}
app.payments.whish.merchant-id=${WHISH_MERCHANT_ID:}
