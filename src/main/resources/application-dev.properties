# Local development only. Activate with (quote the -D flag in PowerShell):
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
# Nothing in this file is a real credential; the secret below is a throwaway that
# only ever signs tokens for a database you are running on your own machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=devpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=dev-only-secret-minimum-32-bytes-long-change-me

logging.level.org.springframework.security=DEBUG
